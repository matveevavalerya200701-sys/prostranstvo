<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3e6a4f">
<meta name="description" content="Личное рабочее пространство: планер, задачи, ссылки, проекты и заметки.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Пространство">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<title>Пространство</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (workspace tree) + one scrolling canvas; drawer slides from the right for record details. */
:root{
  --bg:#f7f7f4; --panel:#efefea; --surface:#ffffff; --line:#e0e0d8; --line-2:#d0d0c6;
  --fg:#22241f; --muted:#6c6f65; --faint:#9a9d93;
  --accent:#3e6a4f; --accent-soft:#e3ece4; --accent-fg:#ffffff;
  --danger:#b4432f; --danger-soft:#f7e4df; --warn:#a7701b; --warn-soft:#f6ecd8; --ok:#3e7a4f;
  --c-moss:#4f7d5b; --c-sky:#3f72a6; --c-plum:#7b4f8e; --c-amber:#b07a1f; --c-rose:#b34d5f; --c-slate:#5c6670;
  --shadow:0 10px 30px -12px rgba(30,35,25,.25), 0 2px 6px rgba(30,35,25,.06);
  --f-ui:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#181a17; --panel:#1f221e; --surface:#232622; --line:#30342e; --line-2:#3d423a;
  --fg:#e7e9e2; --muted:#a2a69b; --faint:#71766c;
  --accent:#8fbf9d; --accent-soft:#2a3a2e; --accent-fg:#132015;
  --danger:#e48a76; --danger-soft:#3d2620; --warn:#e0b060; --warn-soft:#3a2f1c; --ok:#8fbf9d;
  --c-moss:#8fbf9d; --c-sky:#86b2de; --c-plum:#c49bd6; --c-amber:#e0b060; --c-rose:#e68fa0; --c-slate:#a6afb8;
  --shadow:0 12px 34px -10px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#181a17; --panel:#1f221e; --surface:#232622; --line:#30342e; --line-2:#3d423a;
  --fg:#e7e9e2; --muted:#a2a69b; --faint:#71766c;
  --accent:#8fbf9d; --accent-soft:#2a3a2e; --accent-fg:#132015;
  --danger:#e48a76; --danger-soft:#3d2620; --warn:#e0b060; --warn-soft:#3a2f1c; --ok:#8fbf9d;
  --c-moss:#8fbf9d; --c-sky:#86b2de; --c-plum:#c49bd6; --c-amber:#e0b060; --c-rose:#e68fa0; --c-slate:#a6afb8;
  --shadow:0 12px 34px -10px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

#app{display:flex;height:100%}
/* ---------- sidebar ---------- */
#sb{width:264px;flex:0 0 264px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow:hidden}
.sb-top{padding:16px 14px 8px;padding-left:max(14px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{display:block}
.sb-search{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);color:var(--muted);text-align:left}
.sb-search:hover{border-color:var(--line-2)}
kbd{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-left:auto;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.sb-scroll{flex:1;overflow-y:auto;padding:4px 8px 12px;padding-left:max(8px, env(safe-area-inset-left,0px))}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border-radius:6px;color:var(--fg);text-decoration:none;text-align:left;min-height:32px}
.nav-item:hover{background:color-mix(in srgb, var(--fg) 6%, transparent)}
.nav-item.on{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.nav-item .ic{width:18px;height:18px;flex:0 0 18px;color:var(--muted)}
.nav-item .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.nav-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-sec{display:flex;align-items:center;justify-content:space-between;margin:16px 8px 4px;font-size:11.5px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.icon-btn{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:color-mix(in srgb, var(--fg) 8%, transparent);color:var(--fg)}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.tree-row{display:flex;align-items:center}
.tree-row .tw{width:20px;height:24px;display:grid;place-items:center;color:var(--faint);flex:0 0 20px}
.tree-row .tw svg{transition:transform .15s}
.tree-row .tw.open svg{transform:rotate(90deg)}
.tree-row .nav-item{padding-left:4px}
.sb-empty{padding:4px 10px;color:var(--faint);font-size:13px}
.sb-foot{border-top:1px solid var(--line);padding:10px 12px;padding-left:max(12px, env(safe-area-inset-left,0px));display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);flex:1;min-width:0}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:0 0 7px}
.sync.cloud i{background:var(--ok)} .sync.local i{background:var(--warn)} .sync.err i{background:var(--danger)}

/* ---------- main ---------- */
#main{flex:1;min-width:0;height:100%;overflow-y:auto;position:relative}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);min-height:48px}
.menu-btn{display:none}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0;flex:1;flex-wrap:wrap}
.crumbs a{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.crumbs a:hover{color:var(--fg)}
.crumbs .sep{color:var(--faint)}
.wrap{max-width:980px;margin:0 auto;padding-block:8px 80px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:760px}
h1.view-title{font-size:30px;line-height:1.15;letter-spacing:-.02em;font-weight:700;margin:18px 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px}
.section{margin-top:30px}
.section-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.section-h h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:0}
.section-h .more{margin-left:auto;font-size:13px;color:var(--accent);text-decoration:none}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:color-mix(in srgb, var(--fg) 7%, transparent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 35%, transparent)}
.btn svg{width:16px;height:16px}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);padding:2px;background:var(--panel)}
.seg button{padding:5px 11px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--muted);background:transparent}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1}
select.inline{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 8px;font-size:13px;max-width:100%}

/* quick add */
.qa{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px;margin-bottom:14px}
.qa:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.qa input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;outline:none}
.qa .hint{font-size:12px;color:var(--faint);white-space:nowrap}
.capture{padding:6px 6px 6px 14px;border-radius:12px}
.capture input{font-size:15.5px;padding:10px 0}

/* tasks */
.tlist{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tgroup-h{display:flex;align-items:center;gap:8px;padding:8px 14px 6px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;background:var(--panel);border-bottom:1px solid var(--line)}
.tgroup-h.over{color:var(--danger)}
.tgroup-h .n{font-family:var(--f-mono);font-weight:400;color:var(--faint)}
.trow{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
.trow:last-child{border-bottom:0}
.trow:hover{background:color-mix(in srgb, var(--fg) 3%, transparent)}
.trow .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.trow.done .tt{color:var(--faint);text-decoration:line-through}
.check{width:19px;height:19px;flex:0 0 19px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;background:var(--surface);color:transparent}
.check:hover{border-color:var(--accent)}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.check.doing{border-color:var(--c-sky);background:linear-gradient(90deg, color-mix(in srgb,var(--c-sky) 35%, transparent) 50%, transparent 50%)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.due{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.due.over{color:var(--danger)} .due.today{color:var(--warn)}
.prio{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;white-space:nowrap}
.prio.p3{background:var(--danger-soft);color:var(--danger)} .prio.p2{background:var(--warn-soft);color:var(--warn)} .prio.p1{background:var(--panel);color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:10px}
.empty b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}

/* board */
.board-scroll{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(3, minmax(240px, 1fr));gap:12px;min-width:min-content}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col.drop{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:2px 4px}
.col-h .n{font-family:var(--f-mono);font-weight:400;color:var(--faint);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab;display:flex;flex-direction:column;gap:6px}
.card:hover{border-color:var(--line-2)}
.card.dragging{opacity:.4}
.card .ct{overflow-wrap:anywhere}

/* links */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));gap:10px}
.lcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 12px 12px;display:flex;gap:12px;min-width:0}
.lcard:hover{border-color:var(--line-2)}
.mono-ic{width:34px;height:34px;border-radius:8px;flex:0 0 34px;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--accent-fg);background:var(--accent)}
.lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lbody a.lt{font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.lbody a.lt:hover{text-decoration:underline}
.lbody .dom{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbody .note{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ltags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.ltag{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.lcard .edit{position:absolute;top:8px;right:8px;opacity:0}
.lcard:hover .edit,.lcard .edit:focus-visible{opacity:1}
@media (hover:none){.lcard .edit{opacity:1}}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.pcard .pn{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.pcard .pd{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:0}
.bar{height:5px;border-radius:3px;background:var(--panel);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.pstats{display:flex;gap:14px;font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.status{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.status.active{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.status.paused{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.ptitle{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.ptitle input{flex:1;min-width:0;font-size:30px;font-weight:700;letter-spacing:-.02em;border:0;background:transparent;outline:none;padding:2px 0}
.big-dot{width:16px;height:16px;border-radius:5px;flex:0 0 16px}
.prow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.swatches{display:flex;gap:6px}
.sw{width:22px;height:22px;border-radius:6px;border:2px solid transparent}
.sw.on{border-color:var(--fg)}
textarea.desc{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;margin-left:-10px;resize:vertical;min-height:44px;color:var(--fg)}
textarea.desc:hover{border-color:var(--line)}
textarea.desc:focus{outline:none;border-color:var(--accent);background:var(--surface)}

/* notes list */
.nlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.nrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);text-decoration:none;min-width:0}
.nrow:last-child{border-bottom:0}
.nrow:hover{background:color-mix(in srgb, var(--fg) 3%, transparent)}
.nrow .nt{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .ns{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.nrow .nd{font-family:var(--f-mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
.doc-ic{width:18px;height:18px;flex:0 0 18px;color:var(--faint)}

/* editor */
.page-title{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.022em;outline:none;margin:22px 0 6px;overflow-wrap:anywhere;white-space:pre-wrap}
.page-title:empty::before{content:attr(data-ph);color:var(--faint)}
.page-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:18px}
.editor{display:flex;flex-direction:column;padding-bottom:40vh}
.blk{position:relative;display:flex;align-items:flex-start;gap:6px;padding:1px 0;margin-left:-52px;padding-left:52px}
.blk .gut{position:absolute;left:4px;top:3px;display:flex;gap:0;opacity:0;transition:opacity .1s}
.blk:hover .gut,.blk:focus-within .gut{opacity:1}
.gut button{width:22px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--faint)}
.gut button:hover{background:color-mix(in srgb, var(--fg) 8%, transparent);color:var(--fg)}
.gut .handle{cursor:grab}
.blk.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.blk.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.bt{flex:1;min-width:0;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;padding:3px 2px;min-height:1.5em}
.bt:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.blk:not(:focus-within) .bt[data-ph-focus]:empty::before{content:""}
.blk[data-type="h1"] .bt{font-size:25px;font-weight:700;letter-spacing:-.015em;margin-top:18px;line-height:1.25}
.blk[data-type="h2"] .bt{font-size:20px;font-weight:650;margin-top:14px;line-height:1.3}
.blk[data-type="h3"] .bt{font-size:16.5px;font-weight:650;margin-top:8px}
.blk[data-type="h1"] .gut{top:22px}.blk[data-type="h2"] .gut{top:17px}.blk[data-type="h3"] .gut{top:10px}
.blk[data-type="quote"] .bt{border-left:3px solid var(--fg);padding-left:14px;font-size:16px}
.blk[data-type="code"] .bt{font-family:var(--f-mono);font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;tab-size:2}
.blk[data-type="callout"] .bt{background:var(--accent-soft);border-radius:8px;padding:10px 14px 10px 14px}
.blk[data-type="todo"].checked .bt{color:var(--faint);text-decoration:line-through}
.blk .mk{flex:0 0 22px;height:27px;display:grid;place-items:center;color:var(--muted);font-variant-numeric:tabular-nums}
.blk .mk.num{font-size:14px;justify-content:end;padding-right:2px}
.blk .mk .check{width:17px;height:17px;flex-basis:17px;border-radius:5px}
.blk[data-type="divider"] .bt{display:none}
.blk[data-type="divider"] hr{flex:1;border:0;border-top:1px solid var(--line-2);margin:14px 0}
.blk[data-type="page"] .plink{flex:1;display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;text-decoration:none;font-weight:500;text-decoration-line:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;min-width:0}
.blk[data-type="page"] .plink:hover{background:color-mix(in srgb, var(--fg) 5%, transparent)}
.add-blk{margin-top:6px;color:var(--faint);display:flex;align-items:center;gap:6px;padding:6px 2px;font-size:14px;align-self:flex-start}
.add-blk:hover{color:var(--fg)}

/* popover menu */
.pop{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;width:250px;max-height:340px;overflow-y:auto}
.pop .ph{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:6px 8px 4px}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:6px;text-align:left}
.pop button.on,.pop button:hover{background:color-mix(in srgb, var(--fg) 7%, transparent)}
.pop .tic{width:28px;height:28px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);flex:0 0 28px;font-family:var(--f-mono)}
.pop .tl{display:flex;flex-direction:column;line-height:1.25}
.pop .tl small{color:var(--faint);font-size:11.5px}
.pop .sepl{height:1px;background:var(--line);margin:4px 2px}
.pop button.del{color:var(--danger)}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(15,18,14,.32);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px, 100%);background:var(--surface);border-left:1px solid var(--line);z-index:45;transform:translateX(102%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dr-h .k{font-size:12px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;flex:1}
.dr-b{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dr-title{width:100%;border:0;background:transparent;font-size:21px;font-weight:650;resize:none;outline:none;line-height:1.3;padding:0;overflow:hidden}
.field{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px}
.field>label{color:var(--muted);font-size:13px}
.field input,.field select,.field textarea,.full textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:7px 9px}
.field input:focus,.field select:focus,.full textarea:focus{outline:none;border-color:var(--accent)}
.full{display:flex;flex-direction:column;gap:6px}
.full>label{color:var(--muted);font-size:13px}
.full textarea{min-height:120px;resize:vertical}
.dr-f{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.dr-f .grow{flex:1}
.stamp{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}

/* search modal */
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;padding-left:16px;padding-right:16px;background:rgba(15,18,14,.35)}
#modal.on{display:flex}
.sbox{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.sbox input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:16px 18px;font-size:17px;outline:none}
.sres{max-height:52vh;overflow-y:auto;padding:6px}
.sres .grp{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:8px 10px 4px}
.sres a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;text-decoration:none;min-width:0}
.sres a .st{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres a small{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.sres a.on{background:var(--accent-soft)}
.sres .none{padding:18px;color:var(--muted);text-align:center}
/* sync dialog */
.sync-box{padding:20px 22px;display:flex;flex-direction:column;gap:12px;max-height:80vh;overflow-y:auto}
.sync-box h2{margin:0;font-size:19px;letter-spacing:-.01em}
.sync-box p{margin:0;color:var(--muted)}
.sync-box .fld{display:flex;flex-direction:column;gap:4px}
.sync-box .fld label{font-size:13px;color:var(--muted)}
.sync-box .fld input{border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:9px 11px;outline:none;font-size:14.5px;min-width:0;width:100%}
.sync-box .fld input:focus{border-color:var(--accent)}
.sync-box .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sync-box .msg{font-size:13.5px;padding:8px 12px;border-radius:8px;background:var(--panel)}
.sync-box .msg.err{background:var(--danger-soft);color:var(--danger)}
.sync-box .msg.ok{background:var(--accent-soft);color:var(--fg)}
.sync{cursor:pointer;background:none;border:0;padding:4px 6px;margin-left:-6px;border-radius:6px;text-align:left}
.sync:hover{background:color-mix(in srgb, var(--fg) 6%, transparent)}
.sync.ok i{background:var(--ok)} .sync.syncing i{background:var(--c-sky)} .sync.offline i{background:var(--faint)} .sync.error i{background:var(--danger)} .sync.signedout i,.sync.off i{background:var(--warn)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);z-index:80;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:all .18s;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{color:var(--bg);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* home */
.hello{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hello .date{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-transform:lowercase}
.kinds{display:flex;gap:4px;margin-right:2px}
.kinds button{padding:6px 10px;border-radius:7px;font-size:13px;color:var(--muted)}
.kinds button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.home-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px}
.mini{display:flex;flex-direction:column;gap:2px}
.mini a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;text-decoration:none;min-width:0}
.mini a:hover{background:color-mix(in srgb, var(--fg) 5%, transparent)}
.mini a .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{display:flex;gap:12px;align-items:flex-start;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);color:var(--fg);border-radius:10px;padding:10px 14px;margin:12px 0 0;font-size:13.5px}
.loading{display:grid;place-items:center;height:60vh;color:var(--muted)}
/* spaces */
.space-sw{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left;font-weight:600}

.space-sw .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.space-sw small{font-weight:400;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.pop input.pin{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;outline:none}
.pop input.pin:focus{border-color:var(--accent)}
/* planner */
.wrap.wide{max-width:1360px}
.week-nav{display:flex;align-items:center;gap:6px}
.week-sum{display:flex;align-items:center;gap:12px;margin:0 0 18px;color:var(--muted);flex-wrap:wrap}
.week-sum .bar{width:180px;max-width:100%}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:start}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:220px;min-width:0}
.day.is-today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.past{background:color-mix(in srgb, var(--surface) 70%, var(--panel))}
.day.drop{background:var(--accent-soft);border-color:var(--accent)}
.day-h{display:flex;align-items:baseline;gap:6px;padding:10px 10px 6px;border-bottom:1px solid var(--line)}
.day-h .wd{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.day-h .dn{font-size:20px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.is-today .day-h .wd,.is-today .day-h .dn{color:var(--accent)}
.day-h .pr{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.day-b{display:flex;flex-direction:column;gap:2px;padding:6px;flex:1}
.ptask{display:flex;align-items:flex-start;gap:8px;padding:6px 6px;border-radius:6px;cursor:grab;min-width:0}
.ptask:hover{background:color-mix(in srgb, var(--fg) 5%, transparent)}
.ptask .check{width:17px;height:17px;flex-basis:17px;border-radius:5px;margin-top:1px}
.ptask .pt{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13.5px;line-height:1.35}
.ptask.done .pt{color:var(--faint);text-decoration:line-through}
.ptask .dot{margin-top:5px}
.ptask.dragging{opacity:.4}
.day form{padding:4px 6px 8px}
.day form input{width:100%;border:1px dashed transparent;background:transparent;border-radius:6px;padding:5px 6px;font-size:13px;outline:none}
.day form input:hover{border-color:var(--line-2)}
.day form input:focus{border-style:solid;border-color:var(--accent);background:var(--bg)}
.inbox{margin-top:26px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.inbox.drop{border-color:var(--accent);background:var(--accent-soft)}
.inbox .day-b{flex-direction:row;flex-wrap:wrap;gap:6px;padding:4px 0 0}
.inbox .ptask{background:var(--surface);border:1px solid var(--line);flex:0 1 auto;max-width:100%}

/* storage tree */
.ptitle-row{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pg-icon{font-size:44px;line-height:1;margin-top:26px;border-radius:10px;padding:4px}

.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:4px}
.pop .emoji-grid button{font-size:19px;justify-content:center;padding:5px 0}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.trow2{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--line);min-width:0}

.trow2 a{display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-decoration:none}
.trow2 .nt{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow2 .ns{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.trow2 .act{opacity:0}.trow2:hover .act,.trow2 .act:focus-visible{opacity:1}

.blk[data-type="file"]{padding-block:4px}
.fblk{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

.fblk .fi{flex:1;min-width:0;display:flex;flex-direction:column}

.fimg img{display:block;max-width:100%;max-height:520px;width:auto;height:auto}

.fimg .icap span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uploading{opacity:.6}
.editor.filedrop{outline:2px dashed var(--accent);outline-offset:8px;border-radius:8px}

.folders{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}

.folder:hover{border-color:var(--line-2)}
.folder .fn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.folder .n{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.folder svg{width:16px;height:16px;flex:0 0 16px;color:var(--muted)}
.folder.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}

.folder.drop{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

.folder-h{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
.folder-h h2{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em;overflow-wrap:anywhere}
.lcard[draggable="true"]{cursor:grab}
.lcard.dragging{opacity:.4}
.picon{width:18px;flex:0 0 18px;text-align:center;font-size:15px;line-height:1}

}

}

const fmtAgo = iso => {

const Store = {
  mode: 'loading', // loading | cloud | local
  error: null,
  cols: null,
  pending: new Map(),
  chains: new Map(),
  localKey: 'prostranstvo.local.v1',

function put(kind, obj, opts = {}) {
  obj.updated = now();
  S[kind][obj.id] = obj;
  schedule(kind, obj.id, opts.immediate ? 0 : 450);
}
function remove(kind, id) {
  delete S[kind][id];
  schedule(kind, id, 0);
}
function schedule(kind, id, delay) {
  if (Store.mode === 'local' || Store.mode === 'loading') { saveLocalSoon(); Sync.mark(kind, id); return; }
  const key = kind + '/' + id;
  clearTimeout(Store.pending.get(key));
  Store.pending.set(key, setTimeout(() => flush(kind, id), delay));
}
function flush(kind, id) {
  const key = kind + '/' + id;
  clearTimeout(Store.pending.get(key));
  Store.pending.delete(key);
  const prev = Store.chains.get(key) || Promise.resolve();
  const next = prev.then(() => {
    const o = S[kind][id];
    const ref = Store.cols[kind].doc(id);
    return o ? ref.set(JSON.parse(JSON.stringify(o))) : ref.delete();
  }).then(() => { if (Store.error) { Store.error = null; renderSidebar(); } })
    .catch(e => { Store.error = e; console.warn('save failed', e); renderSidebar();
      if (e && e.code === 'quota_exceeded') toast('Хранилище заполнено: удалите лишние записи'); });
  Store.chains.set(key, next);
}
function flushAll() { for (const key of [...Store.pending.keys()]) { const [k, ...rest] = key.split('/'); flush(k, rest.join('/')); } }
let localTimer;
function saveLocalSoon() { clearTimeout(localTimer); localTimer = setTimeout(saveLocal, 300); }
function saveLocal() { if (Store.mode === 'local') lsSet(Store.localKey, JSON.stringify(S)); }
function loadLocal() {

}
addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { flushAll(); saveLocal(); } });
addEventListener('pagehide', () => { flushAll(); saveLocal(); });

async function initStore() {
  let db = null, user = null, id = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (db && user) id = await user.id();
    }
  } catch (e) { console.warn(e); }
  if (!db || !id) {
    Store.mode = 'local';
    loadLocal();
    ensureSpaces();
    render();
    Sync.init();
    return;
  }
  Store.mode = 'cloud';
  const base = db.doc('data/users/' + id + '/workspace');
  Store.cols = {};
  for (const k of KINDS) Store.cols[k] = base.collection(k);
  let firstSeen = 0, migrated = false;
  for (const k of KINDS) {
    let first = true;
    Store.cols[k].onSnapshot(snap => {
      const changes = snap.docChanges();
      for (const ch of changes) {
        const key = k + '/' + ch.doc.id;
        if (Store.pending.has(key)) continue;
        if (ch.type === 'removed') delete S[k][ch.doc.id];
        else S[k][ch.doc.id] = structuredClone(ch.doc.data());
      }
      if (first) { first = false; firstSeen++; if (firstSeen === KINDS.length) maybeMigrate(); }
      if (changes.length || firstSeen === KINDS.length) softRender();
    }, err => {
      Store.error = err; renderSidebar();
      if (err && err.code === 'revoked') { Store.mode = 'local'; }
    });
  }
  function maybeMigrate() {
    if (migrated) return; migrated = true;
    const cloudEmpty = KINDS.every(k => !Object.keys(S[k]).length);
    let local = null; try { local = JSON.parse(lsGet(Store.localKey) || 'null'); } catch {}
    if (cloudEmpty && local && KINDS.some(k => local[k] && Object.keys(local[k]).length)) {
      for (const k of KINDS) for (const o of Object.values(local[k] || {})) { S[k][o.id] = o; schedule(k, o.id, 0); }
      toast('Перенесла данные из этого браузера в облако');
    }
    ensureSpaces();
  }
  setTimeout(() => { if (firstSeen < KINDS.length) softRender(); }, 4000);
}

function filterTasks(arr) {
  const td = today();
  switch (UI.taskFilter) {
    case 'today': return arr.filter(t => t.status !== 'done' && t.due && t.due <= td);
    case 'week': return arr.filter(t => t.status !== 'done' && t.due && t.due <= addDays(td, 7));
    case 'nodate': return arr.filter(t => t.status !== 'done' && !t.due);
    case 'done': return arr.filter(t => t.status === 'done');
    case 'all': return arr;
    default: return arr.filter(t => t.status !== 'done');
  }
}
function groupedTaskList(arr, opts = {}) {
  if (!arr.length) return emptyBox('Задач нет', opts.emptyText || 'Добавьте задачу в поле выше.');
  if (UI.taskFilter === 'done') return `<div class="tlist">${arr.sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||'')).map(t => taskRow(t, opts)).join('')}</div>`;
  const td = today(), groups = [['over','Просрочено',[]],['today','Сегодня',[]],['soon','Ближайшие',[]],['later','Позже',[]],['nodate','Без срока',[]],['done','Готово',[]]];
  const g = Object.fromEntries(groups.map(x => [x[0], x[2]]));
  for (const t of arr.sort(taskSort)) {
    if (t.status === 'done') g.done.push(t);
    else if (!t.due) g.nodate.push(t);
    else if (t.due < td) g.over.push(t);
    else if (t.due === td) g.today.push(t);
    else if (t.due <= addDays(td, 7)) g.soon.push(t);
    else g.later.push(t);
  }
  return `<div class="tlist">${groups.filter(x => x[2].length).map(([k,label,items]) => `<div class="tgroup-h${k==='over'?' over':''}">${label}<span class="n">${items.length}</span></div>${items.map(t => taskRow(t, opts)).join('')}`).join('')}</div>`;
}

function mondayOf(s) { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dstr(d); }
function viewPlanner() {

  const doneN = inWeek.filter(t => t.status === 'done').length;
  const f = s => new Date(s + 'T12:00:00').toLocaleDateString('ru-RU', { day:'numeric', month:'short' }).replace('.', '');

function movePage(id, parentId, spaceId) {

/* ---- block drag & drop ---- */
let dragBid = null, dragTask = null, dragLink = null;
document.addEventListener('dragstart', e => {
  const h = e.target.closest?.('.handle');
  if (h) { dragBid = h.dataset.bid; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'block'); const blk = h.closest('.blk'); e.dataTransfer.setDragImage(blk, 20, 12); return; }
  const lc = e.target.closest?.('.lcard');
  if (lc) { dragLink = lc.dataset.link; lc.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'link'); return; }
  const c = e.target.closest?.('.card, .ptask');
  if (c) { dragTask = c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'task'); }
});
const hasFiles = e => !dragBid && !dragTask && !dragLink && e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
document.addEventListener('dragover', e => {
  if (hasFiles(e) && route().v === 'page') { e.preventDefault(); $('#editor')?.classList.add('filedrop'); return; }
  if (dragBid) {
    const blk = e.target.closest?.('.blk'); $$('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before','drop-after'));
    if (blk && blk.dataset.bid !== dragBid) { e.preventDefault(); const r = blk.getBoundingClientRect(); blk.classList.add(e.clientY < r.top + r.height/2 ? 'drop-before' : 'drop-after'); }
  }
  if (dragLink) { const f = e.target.closest?.('.folder[data-folder]'); $$('.drop').forEach(x => x !== f && x.classList.remove('drop')); if (f) { e.preventDefault(); f.classList.add('drop'); } }
  if (dragTask) { const col = e.target.closest?.('.col, [data-day]'); $$('.drop').forEach(x => x !== col && x.classList.remove('drop')); if (col) { e.preventDefault(); col.classList.add('drop'); } }
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) $('#editor')?.classList.remove('filedrop'); });
document.addEventListener('drop', e => {
  if (hasFiles(e)) { e.preventDefault(); $('#editor')?.classList.remove('filedrop');
    if (route().v === 'page' && curPage() && e.dataTransfer.files.length) { const blk = e.target.closest?.('.blk'); const i = blk ? blkIndex(blk.dataset.bid) + 1 : curPage().blocks.length; Files.add([...e.dataTransfer.files], curPage().id, i); }
    return; }
  if (dragBid) {
    const blk = e.target.closest?.('.blk'); if (blk) { e.preventDefault();
      const before = blk.classList.contains('drop-before'); const p = curPage();
      const from = blkIndex(dragBid); const [mv] = p.blocks.splice(from, 1);
      let to = blkIndex(blk.dataset.bid); if (!before) to++;
      p.blocks.splice(to, 0, mv); savePage(); mountEditor(p.id); }
  }
  if (dragLink) { const f = e.target.closest?.('.folder[data-folder]'); if (f) { e.preventDefault(); const l = S.links[dragLink]; const to = f.dataset.folder === '_none' ? '' : f.dataset.folder;
    if (l && f.dataset.folder !== '' && (l.folderId||'') !== to) { l.folderId = to; put('links', l, {immediate:true}); render(); toast(to ? 'Перенесено в «' + (S.lfolders[to]?.name || '') + '»' : 'Ссылка теперь без папки'); } } }
  if (dragTask) { const col = e.target.closest?.('.col, [data-day]'); if (col) { e.preventDefault(); const t = S.tasks[dragTask];
    if (col.dataset.col) setTaskStatus(t, col.dataset.col); else if (t && t.due !== col.dataset.day) { t.due = col.dataset.day; put('tasks', t, {immediate:true}); render(); } } }
});
document.addEventListener('dragend', () => { dragBid = null; dragTask = null; dragLink = null; $$('.drop-before,.drop-after').forEach(x => x.classList.remove('drop-before','drop-after')); $$('.drop').forEach(x => x.classList.remove('drop')); $$('.dragging').forEach(x => x.classList.remove('dragging')); });

/* ================= actions ================= */
function newPageObj(o = {}) { return { id:uid(), title:'', icon:'', parentId:'', projectId:'', spaceId:UI.space, blocks:[{id:uid(), type:'text', text:''}], created:now(), updated:now(), ...o }; }
function parseTask(text) {
  let title = text.trim(), due = '', priority = 0; const td = today();
  const rx = [[/(^|\s)(сегодня)(?=\s|$)/i, () => td], [/(^|\s)(завтра)(?=\s|$)/i, () => addDays(td,1)], [/(^|\s)(послезавтра)(?=\s|$)/i, () => addDays(td,2)]];
  for (const [r, f] of rx) if (r.test(title)) { due = f(); title = title.replace(r, ' ').trim(); }
  const m = title.match(/(^|\s)(\d{1,2})\.(\d{1,2})(?:\.(\d{2,4}))?(?=\s|$)/);
  if (m) { let y = m[4] ? +m[4] : new Date().getFullYear(); if (y < 100) y += 2000; const d = `${y}-${pad(+m[3])}-${pad(+m[2])}`; if (!isNaN(new Date(d))) { due = d; title = title.replace(m[0], ' ').trim(); } }
  const pm = title.match(/(^|\s)(!{1,3})(?=\s|$)/);
  if (pm) { priority = 3; title = title.replace(pm[0], ' ').trim(); }
  return { title: title.replace(/\s{2,}/g,' '), due, priority };
}
function addTask(text, projectId = '', date = '') {
  const { title, due, priority } = parseTask(text);
  if (!title) return null;
  const t = { id:uid(), title, status:'todo', due: due || date, priority, projectId, spaceId:UI.space, notes:'', created:now() };
  put('tasks', t, {immediate:true}); return t;
}
function addLink(text, projectId = '', folderId = '') {
  const parts = text.trim().split(/\s+/); const url = parts.find(isUrl) || parts[0];
  if (!url) return null;
  const rest = text.replace(url, '').trim();
  const l = { id:uid(), url:normUrl(url), title: rest || titleFromUrl(url), tags:[], projectId, folderId, spaceId:UI.space, note:'', created:now() };
  put('links', l, {immediate:true}); return l;
}
function setTaskStatus(t, s) {
  if (!t) return; t.status = s; t.doneAt = s === 'done' ? now() : ''; put('tasks', t, {immediate:true}); render();
}
let undoBuf = null;
function deleteWithUndo(items, msg) {
  undoBuf = items.map(([k, o]) => [k, structuredClone(o)]);
  for (const [k, o] of items) remove(k, o.id);
  closeDrawer(true); render();
  toast(msg, 'Вернуть', () => { for (const [k, o] of undoBuf || []) put(k, o, {immediate:true}); undoBuf = null; render(); });
}
function deletePage(id) {
  const items = []; const walk = pid => { const p = S.pages[pid]; if (!p) return; items.push(['pages', p]); childPages(pid).forEach(c => walk(c.id)); };
  walk(id);
  const p = S.pages[id];
  if (p && p.parentId && S.pages[p.parentId]) { const par = S.pages[p.parentId]; items.push(['pages', par]); const copy = structuredClone(par); par.blocks = (par.blocks||[]).filter(b => b.pageId !== id); undoBuf = null;
    const before = items.map(([k,o]) => [k, o === par ? copy : structuredClone(o)]); for (const [k,o] of items) if (o !== par) remove(k, o.id); put('pages', par, {immediate:true});
    undoBuf = before; location.hash = 'n-' + par.id;
    toast(items.length > 2 ? `Удалено страниц: ${items.length-1}` : 'Страница удалена', 'Вернуть', () => { for (const [k, o] of undoBuf || []) put(k, o, {immediate:true}); undoBuf = null; render(); });
    return; }
  location.hash = p && p.projectId ? 'p-' + p.projectId : 'notes';
  deleteWithUndo(items, items.length > 1 ? `Удалено страниц: ${items.length}` : 'Страница удалена');
}

function onInput(t) {
  const k = t.dataset.input, id = t.dataset.id;
  if (k === 'proj-name') { const p = S.projects[id]; p.name = t.value; put('projects', p); renderSidebar(); }
  if (k === 'proj-desc') { const p = S.projects[id]; p.description = t.value; put('projects', p); }
  if (k === 'link-q') { UI.linkQ = t.value; render(); }
  if (k === 'lfolder-name') { const f = S.lfolders[id]; f.name = t.value; put('lfolders', f); const h = $('.folder-h h2'); if (h) h.textContent = t.value || 'Без названия'; const fb = $(`.folder[data-folder="${id}"] .fn`); if (fb) fb.textContent = t.value || 'Без названия'; }
  if (k === 'space-name') { const sp = S.spaces[id]; sp.name = t.value; put('spaces', sp); renderSidebar(); }
  if (k === 'dr-title' || k === 'dr-notes' || k === 'dr-url' || k === 'dr-ltitle' || k === 'dr-lnote' || k === 'dr-tags') drawerInput(k, t);
}

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  const inp = f.querySelector('input'); const v = inp.value.trim(); if (!v) return;

    case 'sync-signin': case 'sync-signup': { const email = $('#sy-email').value.trim(), pw = $('#sy-pass').value; if (!email || pw.length < 6) { openSync('Введите почту и пароль не короче 6 символов.', 'err'); break; }
      el.disabled = true; const r = a === 'sync-signin' ? await Sync.client.auth.signInWithPassword({ email, password:pw }) : await Sync.client.auth.signUp({ email, password:pw });
      if (r.error) { openSync(authErr(r.error), 'err'); break; }
      if (!r.data.session) { openSync('Аккаунт создан. Подтвердите адрес по ссылке из письма, затем нажмите «Войти».', 'ok'); break; }

/* ================= drawer ================= */
function openDrawer(kind, id) { UI.drawer = { kind, id }; renderDrawer(); $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); setTimeout(() => { const t = $('#dr-title, #dr-ltitle'); if (t && kind === 'task') autosize(t); }, 0); }
function closeDrawer(silent) { UI.drawer = null; $('#drawer').classList.remove('on'); if (!document.body.classList.contains('sb-open')) $('#scrim').classList.remove('on'); if (!silent) render(); }
function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
function renderDrawer() {
  const d = UI.drawer; if (!d) return;
  const dr = $('#drawer');
  if (d.kind === 'task') {
    const t = S.tasks[d.id]; if (!t) { closeDrawer(true); return; }
    dr.innerHTML = `<div class="dr-h"><span class="k">Задача</span><button class="icon-btn" data-act="dr-close" aria-label="Закрыть">${I.x}</button></div>

      <div class="field"><label for="dr-status">Статус</label><select id="dr-status" data-change="dr-status">${Object.entries(STATUS).map(([k,v]) => `<option value="${k}"${t.status===k?' selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="dr-due">Дата</label><input type="date" id="dr-due" data-change="dr-due" value="${esc(t.due)}"></div>
      <div class="field"><label>Важность</label><div class="seg">${[0,1,2,3].map(n => `<button class="${(t.priority||0)===n?'on':''}" data-act="dr-prio" data-id="${t.id}" data-k="${n}">${PRIO[n]}</button>`).join('')}</div></div>
      <div class="field"><label for="dr-proj">Проект</label><select id="dr-proj" data-change="dr-proj">${projectOptions(t.projectId)}</select></div>
      ${spaces().length > 1 ? `<div class="field"><label for="dr-space">Пространство</label><select id="dr-space" data-change="dr-space">${spaces().map(sp => `<option value="${sp.id}"${spaceOf(t)===sp.id?' selected':''}>${esc(sp.name)}</option>`).join('')}</select></div>` : ''}
      <div class="full"><label for="dr-notes">Заметки</label><textarea id="dr-notes" data-input="dr-notes" placeholder="Детали, контакты, ссылки…">${esc(t.notes)}</textarea></div>
    </div>
    <div class="dr-f"><span class="stamp grow">Создана ${fmtAgo(t.created)}</span><button class="btn danger" data-act="dr-del-task" data-id="${t.id}">Удалить</button></div>`;
  } else {
    const l = S.links[d.id]; if (!l) { closeDrawer(true); return; }
    dr.innerHTML = `<div class="dr-h"><span class="k">Ссылка</span><button class="icon-btn" data-act="dr-close" aria-label="Закрыть">${I.x}</button></div>

      <div class="field"><label for="dr-ltitle">Название</label><input id="dr-ltitle" data-input="dr-ltitle" value="${esc(l.title)}"></div>
      <div class="field"><label for="dr-url">Адрес</label><input id="dr-url" data-input="dr-url" value="${esc(l.url)}" inputmode="url"></div>
      <div class="field"><label for="dr-tags">Теги</label><input id="dr-tags" data-input="dr-tags" value="${esc((l.tags||[]).join(', '))}" placeholder="через запятую"></div>
      <div class="field"><label for="dr-lfolder">Папка</label><select id="dr-lfolder" data-change="dr-lfolder"><option value="">Без папки</option>${lfolders().map(f => `<option value="${f.id}"${l.folderId===f.id?' selected':''}>${esc(f.name||'Без названия')}</option>`).join('')}</select></div>
      <div class="field"><label for="dr-lproj">Проект</label><select id="dr-lproj" data-change="dr-lproj">${projectOptions(l.projectId)}</select></div>

function drawerInput(k, t) {
  const d = UI.drawer; if (!d) return;
  if (d.kind === 'task') { const o = S.tasks[d.id]; if (k === 'dr-title') { o.title = t.value.replace(/\n/g,' '); autosize(t); } if (k === 'dr-notes') o.notes = t.value; put('tasks', o); needsRender = true; }
  else { const o = S.links[d.id]; if (k === 'dr-ltitle') o.title = t.value; if (k === 'dr-url') o.url = t.value.trim(); if (k === 'dr-lnote') o.note = t.value; if (k === 'dr-tags') o.tags = t.value.split(',').map(s => s.trim().replace(/^#/,'')).filter(Boolean); put('links', o); needsRender = true; }
}
function drawerChange(k, t) {
  const d = UI.drawer; if (!d) return;
  if (k === 'dr-space') { const o = S[d.kind === 'task' ? 'tasks' : 'links'][d.id]; o.spaceId = t.value; o.projectId = ''; put(d.kind === 'task' ? 'tasks' : 'links', o, {immediate:true}); closeDrawer(true); render(); toast('Перенесено в «' + (S.spaces[t.value]?.name || '') + '»'); return; }

  else { const o = S.links[d.id]; if (k === 'dr-lproj') o.projectId = t.value; if (k === 'dr-lfolder') o.folderId = t.value; put('links', o, {immediate:true}); }

}

/* ================= search ================= */
let sIdx = 0;
function openSearch() {
  const m = $('#modal'); m.classList.add('on');
  m.innerHTML = `<div class="sbox"><input id="search-q" placeholder="Найти задачу, ссылку, проект или заметку…" autocomplete="off"><div class="sres" id="sres"></div></div>`;
  const q = $('#search-q'); q.focus(); sIdx = 0; drawResults('');
  q.addEventListener('input', () => { sIdx = 0; drawResults(q.value); });
  q.addEventListener('keydown', e => {
    const as = $$('#sres a'); if (!as.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); sIdx = (sIdx+1) % as.length; }
    else if (e.key === 'ArrowUp') { e.preventDefault(); sIdx = (sIdx-1+as.length) % as.length; }
    else if (e.key === 'Enter') { e.preventDefault(); as[sIdx].click(); return; }
    else return;
    as.forEach((a,i) => a.classList.toggle('on', i === sIdx)); as[sIdx].scrollIntoView({block:'nearest'});
  });
}
function closeSearch() { $('#modal').classList.remove('on'); $('#modal').innerHTML = ''; }
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeSearch(); });
function drawResults(q) {
  q = q.toLowerCase().trim();
  const hit = s => !q || String(s||'').toLowerCase().includes(q);
  const groups = [
    ['Проекты', projects().filter(p => hit(p.name) || hit(p.description)).map(p => ({h:'#p-'+p.id, t:p.name||'Без названия', s:PSTATUS[p.status||'active']}))],
    ['Заметки', list('pages').filter(p => hit(p.title) || (q && hit(pageSnippet(p) + ' ' + (p.blocks||[]).map(b=>b.text).join(' ')))).sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).map(p => ({h:'#n-'+p.id, t:pageTitle(p), s:fmtAgo(p.updated)}))],
    ['Задачи', list('tasks').filter(t => hit(t.title) || (q && hit(t.notes))).sort(taskSort).map(t => ({task:t.id, t:t.title, s:(t.status==='done'?'готово':fmtDue(t.due)) + (t.projectId ? ' · ' + projName(t.projectId) : '')}))],
    ['Ссылки', list('links').filter(l => hit(l.title) || hit(l.url) || hit((l.tags||[]).join(' ')) || hit(l.note)).map(l => ({ext:normUrl(l.url), t:l.title||domainOf(l.url), s:domainOf(l.url)}))],
  ].map(([g, arr]) => [g, arr.slice(0, q ? 8 : 4)]).filter(([,arr]) => arr.length);
  let i = 0;
  $('#sres').innerHTML = groups.length ? groups.map(([g, arr]) => `<div class="grp">${g}</div>` + arr.map(r => {
    const cls = i++ === sIdx ? ' class="on"' : '';
    if (r.task) return `<a href="#tasks"${cls} data-act="search-task" data-id="${r.task}"><span class="st">${esc(r.t)}</span><small>${esc(r.s)}</small></a>`;
    if (r.ext) return `<a href="${esc(r.ext)}" target="_blank" rel="noopener noreferrer"${cls} data-act="search-go"><span class="st">${esc(r.t)}</span><small>${esc(r.s)}</small></a>`;
    return `<a href="${r.h}"${cls} data-act="search-go"><span class="st">${esc(r.t)}</span><small>${esc(r.s)}</small></a>`;
  }).join('')).join('') : `<div class="none">Ничего не найдено</div>`;
}
document.addEventListener('click', e => { const a = e.target.closest('[data-act="search-task"]'); if (a) { e.preventDefault(); closeSearch(); openDrawer('task', a.dataset.id); } });

/* ================= export / import ================= */
async function exportData() {
  const data = JSON.stringify({ app:'prostranstvo', version:1, exported:now(), ...S }, null, 2);
  let dl = null; try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch {}
  if (dl) { try { const r = await dl.save({ filename:`prostranstvo-${today()}.json`, data }); if (r && r.status === 'saved') toast('Резервная копия сохранена'); } catch (e) { if (e?.code !== 'cancelled' && e?.code !== 'declined') toast('Не удалось сохранить файл'); } return; }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type:'application/json'})); a.download = `prostranstvo-${today()}.json`; a.click(); } catch { toast('Скачивание недоступно в этом окне'); }
}
$('#import-file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); let n = 0;
    for (const k of KINDS) for (const o of Object.values(d[k] || {})) if (o && o.id) { S[k][o.id] = o; schedule(k, o.id, 0); n++; }
    render(); toast(n ? `Загружено записей: ${n}` : 'В файле нет данных Пространства');
  } catch { toast('Не получилось прочитать файл. Нужен .json, скачанный из Пространства'); }
  e.target.value = '';
});

/* ================= sync (Supabase) ================= */
const SYNC_CFG = 'prostranstvo.sync.cfg', SYNC_DIRTY = 'prostranstvo.sync.dirty', SYNC_META = 'prostranstvo.sync.meta';
const SUPABASE_JS = 'supabase.js';
function loadScript(src) { return new Promise((ok, bad) => { if (window.supabase?.createClient) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
const Sync = {
  client:null, user:null, state:'off', error:'', lastAt:'', busy:false, again:false, timer:null,
  dirty: new Set((() => { try { return JSON.parse(lsGet(SYNC_DIRTY) || '[]'); } catch { return []; } })()),
  cfg() { const f = window.PROSTRANSTVO_CONFIG || {}; let o = {}; try { o = JSON.parse(lsGet(SYNC_CFG) || '{}'); } catch {} let u = o.url || f.supabaseUrl || ''; try { if (u) u = new URL(u).origin; } catch {} return { url:u, key:o.key || f.supabaseKey || '', fromFile: !o.url && !!f.supabaseUrl }; },
  meta() { try { return JSON.parse(lsGet(SYNC_META) || '{}'); } catch { return {}; } },
  setMeta(m) { lsSet(SYNC_META, JSON.stringify({ ...this.meta(), ...m })); },
  async init() {
    if (Store.mode !== 'local') return;
    const c = this.cfg(); if (!c.url || !c.key) { this.state = 'off'; renderSidebar(); return; }
    try { await loadScript(SUPABASE_JS); } catch { this.state = 'offline'; renderSidebar(); return; }
    try { this.client = window.supabase.createClient(c.url, c.key, { auth:{ persistSession:true, storageKey:'prostranstvo-auth', autoRefreshToken:true } }); }
    catch (e) { this.state = 'error'; this.error = e.message; renderSidebar(); return; }
    const { data } = await this.client.auth.getSession();
    this.user = data.session?.user || null;
    this.client.auth.onAuthStateChange((ev, session) => { const u = session?.user || null; if ((u && u.id) !== (this.user && this.user.id)) { this.user = u; this.onUser(); } });
    this.onUser();
  },
  onUser() {
    if (!this.user) { this.state = this.client ? 'signedout' : 'off'; renderSidebar(); softRender(); return; }
    if (this.meta().user !== this.user.id) {
      for (const k of KINDS) for (const id of Object.keys(S[k])) this.dirty.add(k + '/' + id);
      this.setMeta({ user:this.user.id, lastPull:'' }); this.saveDirty();
    }
    this.state = 'syncing'; softRender();
    this.run();
  },
  mark(kind, id) { this.dirty.add(kind + '/' + id); this.saveDirty(); this.soon(); },
  saveDirty() { lsSet(SYNC_DIRTY, JSON.stringify([...this.dirty])); },
  soon(d = 1500) { if (!this.user) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), d); },
  async run() {
    if (!this.user || !this.client) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; const was = this.state; this.state = 'syncing'; if (was !== 'syncing') renderSidebar();
    try { await this.push(); await this.pull(); this.state = 'ok'; this.error = ''; this.lastAt = now(); Files.migrate(); }
    catch (e) { this.state = navigator.onLine === false ? 'offline' : 'error'; this.error = (e && (e.message || e.error_description)) || String(e); console.warn('sync', e); }
    this.busy = false; renderSidebar();
    if (this.again) { this.again = false; this.soon(300); }
  },
  async push() {
    const keys = [...this.dirty]; if (!keys.length) return;
    const sent = new Map();
    const rows = keys.map(key => { const i = key.indexOf('/'), kind = key.slice(0, i), id = key.slice(i + 1), o = S[kind] && S[kind][id];
      sent.set(key, o ? o.updated || '' : null);
      return { user_id:this.user.id, kind, id, data:o ? JSON.parse(JSON.stringify(o)) : null, deleted:!o, updated_at:(o && o.updated) || now() }; });
    for (let i = 0; i < rows.length; i += 400) { const { error } = await this.client.from('items').upsert(rows.slice(i, i + 400), { onConflict:'user_id,kind,id' }); if (error) throw error; }
    for (const [key, ver] of sent) { const i = key.indexOf('/'), o = S[key.slice(0, i)] && S[key.slice(0, i)][key.slice(i + 1)]; if ((o ? o.updated || '' : null) === ver) this.dirty.delete(key); }
    this.saveDirty();
  },
  async pull() {
    let last = this.meta().lastPull || '', changed = false;
    for (;;) {
      let q = this.client.from('items').select('kind,id,data,deleted,synced_at').order('synced_at', { ascending:true }).limit(1000);
      if (last) q = q.gt('synced_at', last);
      const { data, error } = await q; if (error) throw error;
      for (const r of data) {
        last = r.synced_at;
        if (!S[r.kind] || this.dirty.has(r.kind + '/' + r.id)) continue;
        const loc = S[r.kind][r.id];
        if (r.deleted || !r.data) { if (loc) { delete S[r.kind][r.id]; changed = true; } }
        else if (!loc || (r.data.updated || '') >= (loc.updated || '')) { if (JSON.stringify(loc) !== JSON.stringify(r.data)) { S[r.kind][r.id] = r.data; changed = true; } }
      }

  },
};
setInterval(() => { if (document.visibilityState === 'visible') Sync.soon(0); }, 30000);
addEventListener('online', () => Sync.soon(0));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Sync.soon(0); });
function authErr(e) {
  const m = (e && e.message || '').toLowerCase();
  if (m.includes('invalid login')) return 'Неверная почта или пароль.';
  if (m.includes('already registered')) return 'Такой аккаунт уже есть. Нажмите «Войти».';
  if (m.includes('email not confirmed')) return 'Почта не подтверждена. Откройте ссылку из письма или отключите подтверждение в настройках Supabase.';
  if (m.includes('fetch')) return 'Нет связи с сервером. Проверьте интернет и адрес проекта.';
  return 'Ошибка: ' + (e && e.message || e);
}

    <div class="fld"><label for="sy-url">Адрес проекта (Project URL)</label><input id="sy-url" placeholder="https://xxxx.supabase.co" autocomplete="off" inputmode="url"></div>

  else if (!Sync.user) body = `<h2>Вход</h2><p>Один аккаунт на всех ваших устройствах. Если входите впервые, нажмите «Создать аккаунт».</p>${note}
    <div class="fld"><label for="sy-email">Почта</label><input id="sy-email" type="email" autocomplete="username"></div>

  else body = `<h2>Синхронизация включена</h2>${note}
    <p>Вы вошли как <b style="color:var(--fg)">${esc(Sync.user.email || '')}</b>.</p>
    <div class="msg ${Sync.state === 'error' ? 'err' : ''}">${Sync.state === 'error' ? 'Последняя попытка не удалась: ' + esc(Sync.error) : Sync.state === 'offline' ? 'Нет сети. Изменения сохранены на устройстве и отправятся, когда появится интернет.' : Sync.lastAt ? 'Последняя синхронизация: ' + esc(fmtAgo(Sync.lastAt)) : 'Синхронизирую…'}${Sync.dirty.size ? ' Ждут отправки: ' + Sync.dirty.size + '.' : ''}</div>
    <div class="row"><button class="btn primary" data-act="sync-now">Синхронизировать сейчас</button><span style="flex:1"></span><button class="btn ghost" data-act="sync-out">Выйти</button></div>
    <div style="border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px">

      <div class="row"><button class="btn" data-act="files-sql">Скопировать команду</button></div>

/* ================= files ================= */
const FILES_SQL = `-- Пространство: место для файлов. Вставьте в SQL Editor и нажмите Run.
insert into storage.buckets (id, name, public) values ('files', 'files', false) on conflict (id) do nothing;
drop policy if exists "prostranstvo files select" on storage.objects;
drop policy if exists "prostranstvo files insert" on storage.objects;
drop policy if exists "prostranstvo files update" on storage.objects;
drop policy if exists "prostranstvo files delete" on storage.objects;
create policy "prostranstvo files select" on storage.objects for select to authenticated using (bucket_id = 'files' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "prostranstvo files insert" on storage.objects for insert to authenticated with check (bucket_id = 'files' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "prostranstvo files update" on storage.objects for update to authenticated using (bucket_id = 'files' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "prostranstvo files delete" on storage.objects for delete to authenticated using (bucket_id = 'files' and (storage.foldername(name))[1] = auth.uid()::text);`;
const IDB = {
  db:null,
  open() { return this.db || (this.db = new Promise((ok, bad) => { const r = indexedDB.open('prostranstvo-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error); })); },
  async put(k, v) { const d = await this.open(); return new Promise((ok, bad) => { const t = d.transaction('files', 'readwrite'); t.objectStore('files').put(v, k); t.oncomplete = ok; t.onerror = () => bad(t.error); }); },
  async get(k) { const d = await this.open(); return new Promise((ok, bad) => { const r = d.transaction('files').objectStore('files').get(k); r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error); }); },
};
const fmtSize = n => n < 1024 ? n + ' Б' : n < 1048576 ? Math.round(n / 1024) + ' КБ' : (n / 1048576).toFixed(n < 10485760 ? 1 : 0).replace('.', ',') + ' МБ';
const isImg = b => /^image\/(png|jpe?g|gif|webp|svg\+xml|heic|avif)$/i.test(b.mime || '') || /\.(png|jpe?g|gif|webp|avif)$/i.test(b.name || '');
const extOf = n => ((n || '').match(/\.([a-z0-9]{1,5})$/i) || [, 'файл'])[1];
function findBlock(bid) { for (const p of Object.values(S.pages)) { const b = (p.blocks || []).find(x => x.id === bid); if (b) return [p, b]; } return [null, null]; }
function fileBlockHTML(b, gut) {
  const up = Files.busy.has(b.fileId);
  const meta = up ? 'загружается…' : fmtSize(b.size || 0) + (b.where === 'cloud' ? '' : Sync.user ? ' · ждёт отправки в облако' : '');
  if (isImg(b)) return `<div class="blk${up ? ' uploading' : ''}" data-type="file" data-bid="${b.id}">${gut}<div class="fimg"><div class="ibox" data-act="file-open" data-bid="${b.id}"><img alt="${esc(b.name)}" data-fimg="${b.id}" hidden><span data-fph="${b.id}">${up ? 'Загружаю…' : 'Открываю фото…'}</span></div><div class="icap"><span>${esc(b.name)} · ${esc(meta)}</span><button class="btn ghost" style="padding:3px 8px;font-size:12.5px" data-act="file-dl" data-bid="${b.id}">Скачать</button></div></div></div>`;
  return `<div class="blk${up ? ' uploading' : ''}" data-type="file" data-bid="${b.id}">${gut}<div class="fblk"><span class="fx">${esc(extOf(b.name))}</span><span class="fi"><span class="fname">${esc(b.name)}</span><span class="fmeta">${esc(meta)}</span></span><span class="fact"><button class="btn ghost" style="padding:5px 9px" data-act="file-open" data-bid="${b.id}">Открыть</button><button class="btn ghost" style="padding:5px 9px" data-act="file-dl" data-bid="${b.id}">Скачать</button></span></div></div>`;
}
const Files = {
  busy: new Set(), cache: new Map(), migrating:false,
  pick(pageId, index, replaceBid, after) {
    const inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true; inp.hidden = true;
    inp.onchange = () => { const fs = [...inp.files]; inp.remove(); if (!fs.length) return; if (after) after(); setTimeout(() => this.add(fs, pageId, index, replaceBid), after ? 60 : 0); };
    document.body.appendChild(inp); inp.click();
  },
  async add(fs, pageId, index, replaceBid) {
    const p = S.pages[pageId]; if (!p) return;
    const big = fs.filter(f => f.size > 50 * 1048576); if (big.length) toast('Файлы больше 50 МБ не поддерживаются: ' + big.map(f => f.name).join(', '));
    fs = fs.filter(f => f.size <= 50 * 1048576); if (!fs.length) return;
    const blocks = fs.map(f => ({ id:uid(), type:'file', fileId:uid(), name:f.name || 'файл', size:f.size, mime:f.type || '', where:'local' }));
    p.blocks = p.blocks || [];
    if (replaceBid) { const ri = p.blocks.findIndex(x => x.id === replaceBid); if (ri >= 0 && !p.blocks[ri].text) { p.blocks.splice(ri, 1); if (ri < index) index--; } }
    p.blocks.splice(Math.min(index, p.blocks.length), 0, ...blocks);
    if (p.blocks[p.blocks.length - 1].type === 'file') p.blocks.push({ id:uid(), type:'text', text:'' });
    blocks.forEach(b => this.busy.add(b.fileId));
    put('pages', p, {immediate:true}); if (edPageId === pageId && route().v === 'page') mountEditor(pageId);
    let failed = 0;
    for (let k = 0; k < fs.length; k++) {
      const f = fs[k], b = blocks[k];
      try { await IDB.put(b.fileId, f); } catch (e) { console.warn('idb', e); }
      if (Sync.user && Sync.client) { const r = await this.upload(b, f); if (!r) failed++; }
      this.busy.delete(b.fileId);
      const [pp, bb] = findBlock(b.id); if (pp && bb) { Object.assign(bb, { where:b.where, path:b.path }); put('pages', pp, {immediate:true}); }
      if (edPageId === pageId && route().v === 'page' && !editingText()) mountEditor(pageId);
    }
    if (failed) toast('Файлы сохранены на этом устройстве, но не в облаке. Включите место для файлов: внизу слева → синхронизация → «Файлы в облаке».');
    else toast(fs.length > 1 ? 'Файлы добавлены: ' + fs.length : 'Файл добавлен');
  },
  async upload(b, blob) {
    const safe = (b.name || 'file').replace(/[^\w.\-]+/g, '_').slice(-80);
    const path = Sync.user.id + '/' + b.fileId + '-' + safe;
    try { const { error } = await Sync.client.storage.from('files').upload(path, blob, { contentType:b.mime || 'application/octet-stream', upsert:true }); if (error) throw error; b.where = 'cloud'; b.path = path; return true; }
    catch (e) { console.warn('upload', e); return false; }
  },
  async url(b, download) {
    const key = b.fileId + (download ? ':d' : '');
    const c = this.cache.get(key); if (c && c.exp > Date.now()) return c.url;
    let u = null, ttl = 50 * 60000;
    if (b.where === 'cloud' && b.path && Sync.client && Sync.user) {
      const { data, error } = await Sync.client.storage.from('files').createSignedUrl(b.path, 3600, download ? { download:b.name } : undefined);
      if (!error && data) u = data.signedUrl;
    }
    if (!u) { const blob = await IDB.get(b.fileId).catch(() => null); if (blob) { u = URL.createObjectURL(blob); ttl = 864e5; } }
    if (u) this.cache.set(key, { url:u, exp:Date.now() + ttl });
    return u;
  },
  hydrate() {
    $$('img[data-fimg]').forEach(async img => {
      const [, b] = findBlock(img.dataset.fimg); if (!b || this.busy.has(b.fileId)) return;
      const u = await this.url(b, false); const ph = $(`[data-fph="${b.id}"]`);
      if (u) { img.onload = () => { img.hidden = false; ph && ph.remove(); }; img.src = u; }
      else if (ph) ph.textContent = b.where === 'cloud' ? 'Фото в облаке: войдите в аккаунт, чтобы его увидеть' : 'Фото сохранено на другом устройстве';
    });
  },
  async open(bid, download) {
    const [, b] = findBlock(bid); if (!b) return;
    const w = download ? null : window.open('', '_blank');
    const u = await this.url(b, download);
    if (!u) { if (w) w.close(); toast(b.where === 'cloud' ? 'Не получилось открыть файл. Проверьте интернет и вход в аккаунт.' : 'Этот файл сохранён на другом устройстве и ещё не попал в облако.'); return; }
    if (w) { w.location.href = u; return; }
    const a = document.createElement('a'); a.href = u; a.download = b.name || 'file'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  },
  async migrate() {
    if (this.migrating || !Sync.user) return; this.migrating = true;
    try {
      for (const p of Object.values(S.pages)) for (const b of (p.blocks || [])) {
        if (b.type !== 'file' || b.where === 'cloud' || this.busy.has(b.fileId)) continue;
        const blob = await IDB.get(b.fileId).catch(() => null); if (!blob) continue;
        if (await this.upload(b, blob)) { put('pages', p, {immediate:true}); }
        else break;
      }
    } finally { this.migrating = false; }
  },
};

/* ================= toast ================= */
let toastT;
function toast(msg, btn, fn) {
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${btn ? `<button id="toast-btn">${esc(btn)}</button>` : ''}`;
  el.classList.add('on'); clearTimeout(toastT);
  if (btn) $('#toast-btn').onclick = () => { el.classList.remove('on'); fn(); };
  toastT = setTimeout(() => el.classList.remove('on'), btn ? 6000 : 2600);
}

/* ================= boot ================= */
['gesturestart','gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive:false }));
const th = lsGet('ui.theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
initStore();
setInterval(() => { if (route().v === 'home' && !editingText() && document.visibilityState === 'visible') { /* keep "today" fresh across midnight */ const d = today(); if (d !== initStore.day) { initStore.day = d; render(); } } }, 60000);
initStore.day = today();
})();
